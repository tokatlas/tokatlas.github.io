name: data-checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset
        run: python3 scripts/check_data.py
      - name: No em dashes in authored and generated files
        run: python3 scripts/check_style.py
      - name: No broken internal links
        run: python3 scripts/check_links.py
