name: data-checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: data-checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate dataset
        run: python3 scripts/check_data.py
      - name: No em dashes in authored and generated files
        run: python3 scripts/check_style.py
      - name: No broken internal links
        run: python3 scripts/check_links.py
      - name: Restore quote cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: quote-cache-${{ github.sha }}
          restore-keys: quote-cache-
      - name: Seed quote cache from release
        # The actions cache only ever holds what a prior run managed to save,
        # and a cold run cannot fetch the ~13k immutable oMLX trace pages inside
        # the job timeout (omlx 429-throttles bursts). A restored cache can also
        # be near-full yet missing the specific pages a prior CI run never
        # fetched (e.g. traces deleted upstream after we cached them), which then
        # 404 on re-fetch. So always top up from a pre-warmed release asset;
        # --keep-newer-files means a fresher restored entry is never reverted by
        # the snapshot, and existing files are untouched, so this only fills gaps.
        run: |
          echo "cache has $(ls .cache 2>/dev/null | wc -l) files after restore"
          curl -fsSL -o /tmp/cache-seed.tar.gz \
            https://github.com/tokatlas/tokatlas.github.io/releases/download/cache-seed/cache-seed.tar.gz
          mkdir -p .cache
          tar xzf /tmp/cache-seed.tar.gz -C .cache --keep-newer-files
          echo "cache now has $(ls .cache | wc -l) files"
      - name: Quotes verified against (cached) sources
        run: python3 scripts/check_quotes.py
      - name: Save quote cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: quote-cache-${{ github.sha }}
