name: weekly-release
on:
  schedule:
    # Monday 07:00 UTC
    - cron: "0 7 * * 1"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create weekly release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="release-$(date -u +%Y-%m-%d)"
          gh release view "$tag" >/dev/null 2>&1 && exit 0
          gh release create "$tag" --title "Weekly release $(date -u +%Y-%m-%d)" \
            --notes-file CHANGELOG.md --latest=false
          echo "created $tag"
